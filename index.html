<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Area - Simulasi CAT CPNS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Simulasi CAT CPNS</h1>
            <p class="text-blue-100 text-sm mt-1">Portal Masuk Member & Aktivasi Akun</p>
        </div>

        <div class="p-6">
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <div id="login-section">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Masuk Member</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email Terdaftar</label>
                        <input type="email" id="login-email" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="email@contoh.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kata Sandi (Password)</label>
                        <input type="password" id="login-password" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="••••••••">
                        <p class="text-xs text-gray-500 mt-1">Gunakan kata sandi generik jika baru pertama kali masuk.</p>
                    </div>
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition shadow">Masuk Sekarang</button>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                    <p class="text-sm text-gray-600 mb-3">Belum punya akun atau belum mendaftar?</p>
                    <a href="https://tescpnsonline.myr.id/pl/simulasi-tes-cat-cpns/" target="_blank" class="inline-block w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition shadow">
                        Daftar Pembelian di Mayar
                    </a>
                </div>
            </div>

            <div id="member-dashboard" class="hidden space-y-4 text-center">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <h3 class="text-lg font-bold text-gray-800">Selamat Datang!</h3>
                    <p id="user-email-display" class="text-sm font-medium text-blue-600 mt-1"></p>
                </div>

                <a href="https://member.gratis.tescpns.online/" class="block w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 transition shadow text-center">
                    🚀 Akses Halaman Member Utama
                </a>

                <button id="btn-show-update-pass" class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg font-medium hover:bg-gray-200 transition text-sm">
                    🔒 Ganti Kata Sandi
                </button>
                
                <button id="btn-logout" class="w-full text-red-500 text-sm py-1 hover:underline">
                    Keluar (Logout)
                </button>
            </div>

            <div id="update-password-section" class="hidden">
                <h2 class="text-xl font-bold text-gray-800 mb-2">Ganti Kata Sandi</h2>
                <form id="update-password-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kata Sandi Baru</label>
                        <input type="password" id="new-password" minlength="6" required class="w-full mt-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm" placeholder="Minimal 6 karakter">
                    </div>
                    <button type="submit" id="btn-update-pass" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold hover:bg-green-700 transition shadow">
                        Simpan Kata Sandi Baru
                    </button>
                    <button type="button" id="btn-cancel-update" class="w-full bg-gray-100 text-gray-600 py-2 rounded-lg font-medium hover:bg-gray-200 transition text-sm">
                        Batal
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_PROJECT_REF = "fnkxkwecgkfhdphlzfft";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZueGt4d2VjZ2tmaGRwaGx6ZmZ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MzQ2NTUsImV4cCI6MjEwMDUxMDY1NX0.r7p2YF4RVEZQQGDAQqvL4Am9n8vpQbuIQQjYLeH1upw";
        let currentUserAccessToken = null;

        const loginSection = document.getElementById('login-section');
        const loginForm = document.getElementById('login-form');
        const memberDashboard = document.getElementById('member-dashboard');
        const updatePasswordSection = document.getElementById('update-password-section');
        const updatePasswordForm = document.getElementById('update-password-form');
        const alertBox = document.getElementById('alert-box');
        const btnSubmit = document.getElementById('btn-submit');

        function showAlert(message, isSuccess = false) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 p-3 rounded-lg text-sm ${isSuccess ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            alertBox.classList.remove('hidden');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Memproses...";
            alertBox.classList.add('hidden');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert("Gagal masuk: " + (data.error_description || data.msg || "Kredensial tidak valid"));
                } else {
                    currentUserAccessToken = data.access_token;
                    showAlert("Berhasil masuk!", true);
                    showDashboard(data.user);
                }
            } catch (err) {
                showAlert("Kesalahan jaringan: Silakan periksa koneksi atau coba jendela Incognito.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Masuk Sekarang";
            }
        });

        function showDashboard(user) {
            loginSection.classList.add('hidden');
            updatePasswordSection.classList.add('hidden');
            document.getElementById('user-email-display').textContent = user.email;
            memberDashboard.classList.remove('hidden');
        }

        document.getElementById('btn-show-update-pass').addEventListener('click', () => {
            memberDashboard.classList.add('hidden');
            updatePasswordSection.classList.remove('hidden');
        });

        document.getElementById('btn-cancel-update').addEventListener('click', () => {
            updatePasswordSection.classList.add('hidden');
            memberDashboard.classList.remove('hidden');
        });

        updatePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            try {
                const res = await fetch(`https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/user`, {
                    method: 'PUT',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${currentUserAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert("Gagal mengubah kata sandi: " + (data.msg || data.message));
                } else {
                    showAlert("Kata sandi berhasil diperbarui!", true);
                    setTimeout(() => location.reload(), 1500);
                }
            } catch (err) {
                showAlert("Gagal memperbarui: " + err.message);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => location.reload());
    </script>
</body>
</html>
